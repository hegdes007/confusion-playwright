# .github/workflows/playwright.yml

name: Playwright Cucumber Tests

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      # Install all three Playwright browsers
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # Run tests and generate consolidated Cucumber report
      - name: Run Cucumber Tests
        id: cucumber-tests
        run: npm test
        continue-on-error: true
        env:
          CI: true

      # Make sure report generation was successful
      - name: Verify Cucumber Report
        if: always()
        run: |
          if [ ! -f reports/cucumber-report/index.html ]; then
            echo "Cucumber HTML report was not generated!"
            exit 1
          fi

          echo "Cucumber HTML report is ready for deployment."

      # Configure GitHub Pages
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # Upload the report for GitHub Pages deployment
      - name: Upload Report to GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: reports/cucumber-report

      # Deploy report to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Preserve the failed test status after publishing the report
      - name: Mark Workflow Failed If Tests Failed
        if: always() && steps.cucumber-tests.outcome == 'failure'
        run: |
          echo "Some browser tests failed."
          echo "The Cucumber report has still been published."
          exit 1

    # GitHub Pages deployment permissions
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
